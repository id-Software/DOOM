[workspace]
members = ["crates/doom-types", "crates/doom-wad", "crates/doom-map", "crates/doom-sim", "crates/doom-test-evidence", "crates/doom-render", "crates/doom-sound", "crates/doom-game", "crates/doom-play"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
repository = "https://github.com/Copgunn/DOOM"
publish = false

[workspace.dependencies]
doom-types = { path = "crates/doom-types" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The renderer's debug tests render and hash (SHA-256) about 119,000 frames: optimize the
# renderer crate and the hash crates in debug builds (overflow checks and debug assertions stay
# on). Every other crate keeps the default dev profile.
[profile.dev.package.doom-render]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
